<body>
    <hr align="right" width="100px" size="1" color="black">
    <h1 align="right">春晓</h1>
    <p align="right">孟浩然</p>
    <p align="right">春眠不觉晓，处处闻啼鸟 <br> 夜来风雨声，花落知多少</p>
    <hr align="right" width="100px" size="1" color="black">
    <br>
    <p align="center" style="color: white;">好吧，就这样吧，难以想象作业和昨天的几乎无异，也可能是给了两天时间写，总之就先这样吧</p>
